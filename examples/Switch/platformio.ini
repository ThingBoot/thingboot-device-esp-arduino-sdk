; ThingBoot Switch 示例（继电器）
; 默认 WiFi 联网，直接编译即可（SDK base 库自动链接）

[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; ---- 联网 addon（v1.3 起）----
; 需要使用以太网、GSM 或 BLE 时，分两步：
; 1. 在 build_flags 打开对应开关，链接器会追加 addon 库：
;      -DTBD_ETHER  → 追加链接 addon_net_ether_<芯片>.a
;      -DTBD_GSM    → 追加链接 addon_net_gsm_<芯片>.a
;      -DTBD_BLE    → 追加链接 addon_net_ble_<芯片>.a（ESP32/S3/C3/C6）
; 2. 在代码中 device.setup() 之前调用一行 install（见 main.cpp 注释）：
;      tb_addon_net_ether_install(); / tb_addon_net_gsm_install(); / tb_addon_net_ble_install();
;
; 注：-DTBD_DEBUG 已废弃（v1.3 起日志恒带，device.onDebug 注册回调即输出）
